name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run i18n:check
      - run: npm run build
      - name: Tamaño del JS inicial (tope 200 KB comprimido)
        run: |
          size=$(cat apps/web/dist/assets/index-*.js | gzip -c | wc -c)
          echo "JS inicial: $size bytes gzip"
          test "$size" -le 204800

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Desplegar en Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
      - name: Sin secretos de Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Faltan CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en los secretos del repo; no se despliega."
