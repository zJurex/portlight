<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portlight — producí, comerciá y competí por tu provincia</title>
  <meta name="description" content="Un mundo compartido de empresas: producí, comerciá y competí por tu provincia. Gratis, en el navegador y sin registro.">
  <meta name="theme-color" content="#0E1B2E">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="alternate" hreflang="es" href="/es/">
  <link rel="alternate" hreflang="en" href="/en/">
  <link rel="alternate" hreflang="pt" href="/pt/">
  <link rel="alternate" hreflang="x-default" href="/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portlight">
  <meta property="og:description" content="Un mundo compartido de empresas: producí, comerciá y competí por tu provincia.">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <div id="app">
    <canvas id="map" tabindex="0" aria-label="Mapa"></canvas>
    <header id="topbar"></header>
    <div class="map-ctrl">
      <button id="zoom-in" class="icon-btn"></button>
      <button id="zoom-out" class="icon-btn"></button>
      <button id="go-home" class="icon-btn"></button>
    </div>
    <p id="hint" hidden></p>
    <canvas id="minimap"></canvas>
    <section id="sheet" hidden aria-live="polite"></section>
    <nav id="tabs"></nav>
    <div id="overlay" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
